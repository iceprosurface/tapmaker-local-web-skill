[project]
name = "tapmaker-local-web"
version = "0.1.0"
description = "Standalone local UrhoX Web preview for TapMaker Workspace"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "iceprosurface" }]
dependencies = [
    "watchfiles>=1.1,<2",
]

[project.scripts]
tapmaker-local-web = "tapmaker_local_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapmaker_local_web"]
